<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digitakt II Plugin</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        /* Centers the hardware UI in the plugin window */
        body {
            background-color: #2b2b2b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .digitakt-hardware {
            background-color: #1c1d21;
            padding: 40px;
            border-radius: 12px;
            display: inline-block;
            font-family: sans-serif;
        }

        .oled-screen {
            background-color: #000000;
            border: 2px solid #0f0f0f;
            border-radius: 4px;
            width: 320px;
            height: 160px;
            padding: 8px 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            color: #c4d7f5;
            font-family: 'VT323', monospace;
            font-size: 18px;
            text-transform: uppercase;
            text-shadow: 0 0 2px rgba(196, 215, 245, 0.4);
        }

        .oled-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #c4d7f5;
            padding-bottom: 2px;
            margin-bottom: 12px;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .oled-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            flex-grow: 1;
        }

        .oled-param {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .param-icon {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            fill: none;
            stroke: #c4d7f5;
            stroke-width: 2;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }

        .param-label {
            font-size: 14px;
            letter-spacing: 1px;
            line-height: 1;
        }

        .param-value {
            font-size: 16px;
            background: #c4d7f5;
            color: #000;
            padding: 0 4px;
            margin-bottom: 2px;
        }

        .oled-param.selected .param-box {
            border: 2px solid #c4d7f5;
            padding: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer; /* Makes it look clickable */
        }
        
        .oled-param.selected .param-box:hover {
            background-color: rgba(196, 215, 245, 0.2);
        }
    </style>
</head>
<body>
    <!-- Hardware Casing -->
    <div class="digitakt-hardware">
        
        <!-- OLED Screen -->
        <div class="oled-screen">
            <div class="oled-header">
                <span>A03 ONESHOT:LAW TOOL</span>
            </div>

            <!-- 4x2 Parameter Grid -->
            <div class="oled-grid">
                
                <div class="oled-param selected" id="smp-loader">
                    <div class="param-box">
                        <span class="param-label">SMP</span>
                        <span class="param-value">5</span>
                    </div>
                </div>

                <div class="oled-param">
                    <svg class="param-icon" viewBox="0 0 24 24">
                        <path d="M4 12 h16 M4 12 l4 -4 M4 12 l4 4 M20 12 l-4 -4 M20 12 l-4 4" />
                    </svg>
                    <span class="param-label">TUNE</span>
                </div>

                <div class="oled-param">
                    <svg class="param-icon" viewBox="0 0 24 24">
                        <path d="M6 6 v12 l8 -6 z M18 6 v12" />
                    </svg>
                    <span class="param-label">PLAY</span>
                </div>

                <div class="oled-param">
                    <svg class="param-icon" viewBox="0 0 24 24">
                        <path d="M4 20 h16 M8 20 v-12 M16 20 v-12 h-8" />
                    </svg>
                    <span class="param-label">LEV</span>
                </div>

                <div class="oled-param">
                    <svg class="param-icon" viewBox="0 0 24 24">
                        <path d="M4 4 v16 M4 12 h12 l-4 -4 M16 12 l-4 4" />
                    </svg>
                    <span class="param-label">STRT</span>
                </div>

                <div class="oled-param">
                    <svg class="param-icon" viewBox="0 0 24 24">
                        <path d="M8 6 h-4 v12 h4 M16 6 h4 v12 h-4 M4 12 h16" />
                    </svg>
                    <span class="param-label">LEN</span>
                </div>

                <div class="oled-param">
                    <svg class="param-icon" viewBox="0 0 24 24">
                        <path d="M4 8 h12 v8 h-12 z M16 12 l4 -4 M16 12 l4 4" />
                    </svg>
                    <span class="param-label">LOOP</span>
                </div>

                <div class="oled-param">
                    <svg class="param-icon" viewBox="0 0 24 24">
                        <path d="M4 18 h16 v-10 h-16 z" />
                    </svg>
                    <span class="param-label">LEV</span>
                </div>

            </div>
        </div>
    </div>

    <!-- Sample Loading Logic -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const smpBox = document.getElementById('smp-loader');
        const smpLabel = smpBox.querySelector('.param-value');
        const headerText = document.querySelector('.oled-header span');

        smpBox.addEventListener('click', () => {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'audio/wav, audio/mpeg, audio/aiff, audio/flac';

            fileInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                smpLabel.innerText = "..."; 

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                    const leftChannel = Array.from(audioBuffer.getChannelData(0));
                    const rightChannel = audioBuffer.numberOfChannels > 1 
                        ? Array.from(audioBuffer.getChannelData(1)) 
                        : leftChannel; 

                    const sampleId = 'usr_' + Date.now();
                    const sampleName = file.name.substring(0, 10).toUpperCase();

                    if (window.JUCEBridge) {
                        window.JUCEBridge.emit('addUserSample', {
                            id: sampleId,
                            name: sampleName,
                            L: leftChannel,
                            R: rightChannel
                        });
                    } else {
                        console.log("Decoded ready for C++:", sampleName, leftChannel.length, "samples");
                    }

                    smpLabel.innerText = "U1";
                    headerText.innerText = `U01 ONESHOT:${sampleName}`;

                } catch (err) {
                    console.error("Error decoding audio:", err);
                    smpLabel.innerText = "ERR";
                }
            };
            fileInput.click();
        });
    </script>
</body>
</html>
